name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.x' }
      - run: dotnet restore backend/Vertex.sln --source https://api.nuget.org/v3/index.json
      - run: dotnet build backend/src/Vertex.Api/Vertex.Api.csproj --no-restore --configuration Release
      - run: dotnet test backend/tests/Vertex.Domain.Tests/Vertex.Domain.Tests.csproj --configuration Release --no-restore

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
        working-directory: terraform
      - run: terraform init -backend=false
        working-directory: terraform
      - run: terraform validate
        working-directory: terraform
      - uses: azure/setup-helm@v4
      - run: helm lint helm/vertex
      - run: helm template vertex helm/vertex --set ingress.host=vertex.example.com > /tmp/vertex-rendered.yaml

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'

  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
        if: matrix.language == 'csharp'
      - uses: github/codeql-action/analyze@v3

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag vertex-api:ci --file backend/src/Vertex.Api/Dockerfile backend
      - run: docker build --tag vertex-frontend:ci --file frontend/Dockerfile frontend
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: vertex-api:ci
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: vertex-frontend:ci
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - uses: anchore/sbom-action@v0
        with:
          image: vertex-api:ci
          artifact-name: vertex-api-sbom.spdx.json
          output-file: vertex-api-sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: container-sbom
          path: vertex-api-sbom.spdx.json
