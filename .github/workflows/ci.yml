name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.x' }
      - run: dotnet restore backend/src/Vertex.Api/Vertex.Api.csproj --source https://api.nuget.org/v3/index.json
      - run: dotnet build backend/src/Vertex.Api/Vertex.Api.csproj --no-restore --configuration Release
      - run: dotnet test backend/tests/Vertex.Domain.Tests/Vertex.Domain.Tests.csproj --configuration Release --no-restore

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
