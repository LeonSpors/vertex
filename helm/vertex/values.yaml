replicaCount: 2

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

api:
  existingSecret: vertex-api-config
  image:
    repository: ghcr.io/vertex/vertex-api
    tag: latest
    pullPolicy: IfNotPresent
  port: 8080
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  env:
    databaseUseInMemory: "false"
    kubernetesMode: Cluster

frontend:
  image:
    repository: ghcr.io/vertex/vertex-frontend
    tag: latest
    pullPolicy: IfNotPresent
  port: 80
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 256Mi }

postgres:
  host: vertex-postgresql
  port: 5432
  database: vertex
  username: vertex
  existingSecret: vertex-postgresql

redis:
  host: vertex-redis-master
  port: 6379

ingress:
  enabled: true
  className: nginx
  host: vertex.local
  tls: false
  issuer: letsencrypt-prod

serviceAccount:
  create: true
  name: vertex-api

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
