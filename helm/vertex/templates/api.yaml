apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vertex.fullname" . }}-api
  labels:
    {{- include "vertex.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "vertex.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "vertex.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports: [{ name: http, containerPort: {{ .Values.api.port }} }]
          env:
            - name: Database__UseInMemory
              value: {{ .Values.api.env.databaseUseInMemory | quote }}
            - name: Kubernetes__Mode
              value: {{ .Values.api.env.kubernetesMode | quote }}
            - name: Jwt__Key
              valueFrom:
                secretKeyRef: { name: {{ .Values.api.existingSecret }}, key: jwt-key }
            - name: ConnectionStrings__Postgres
              valueFrom:
                secretKeyRef: { name: {{ .Values.postgres.existingSecret }}, key: connection-string }
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vertex.fullname" . }}-api
  labels:
    {{- include "vertex.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "vertex.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
