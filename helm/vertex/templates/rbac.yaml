{{- if .Values.serviceAccount.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "vertex.fullname" . }}-api
  labels:
    {{- include "vertex.labels" . | nindent 4 }}
rules:
  - apiGroups: ["", "apps", "networking.k8s.io", "policy"]
    resources: ["pods", "pods/log", "services", "secrets", "namespaces", "resourcequotas", "limitranges", "deployments", "deployments/scale", "ingresses", "ingressclasses", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["nodes", "storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "vertex.fullname" . }}-api
  labels:
    {{- include "vertex.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "vertex.fullname" . }}-api
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
